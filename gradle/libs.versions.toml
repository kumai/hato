# Dependency and plugin versions. Only test and build-time dependencies appear here:
# the published modules have no runtime dependencies by design.

[versions]
junit = "6.1.3"
assertj = "3.27.7"
awaitility = "4.3.0"
testcontainers = "2.0.5"
graalvm-native = "1.1.14"
jspecify = "1.0.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
errorprone-plugin = "5.1.1"
checkstyle = "14.1.0"

[libraries]
# Nullness annotations. Build-time only: never a runtime or POM dependency of the published jars.
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
# Static nullness checking of @NullMarked code. Runs inside javac at build time only.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
# Layout and import checks over the hand-written sources. Build time only.
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
# Real brokers in Docker for the integrationTest suites. Only the core library is used: each test
# class decides whether a missing Docker skips it or, in CI, fails the build.
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }

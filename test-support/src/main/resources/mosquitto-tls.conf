# TLS listeners only. The PEM files are exported from the repository's public test identities
# (tls/*.p12) when the container is defined.

# Server authentication: clients verify the broker, which asks for no client certificate.
listener 8883
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key

# Mutual TLS: the broker also requires a client certificate signed by the test CA.
listener 8884
cafile /mosquitto/config/tls/ca.crt
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key
require_certificate true

# TLS authenticates the client on 8884; MQTT credentials are not checked on either listener.
allow_anonymous true

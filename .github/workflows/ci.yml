name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - run: ./gradlew build :build-logic:check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  native-smoke:
    name: GraalVM native-image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - run: ./gradlew :native-smoke:nativeCompile
      # The smoke reads the public test identities for its TLS round trip at run time. It takes
      # seconds; the limit stops a hang in the image long before the job's default timeout.
      - timeout-minutes: 5
        run: |
          ./native-smoke/build/native/nativeCompile/hato-native-smoke \
            test-support/src/main/resources/tls

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      # The tests against EMQX, HiveMQ CE, NanoMQ, and RabbitMQ run in the interop job, and
      # the client's integration tests on one carrier in a job of their own, so that this one
      # stays short.
      - run: >-
          ./gradlew build :build-logic:check -Phato.interop=none
          -x :hato-client:integrationTestSingleCarrier
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  single-carrier:
    name: Client integration tests on one carrier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - run: ./gradlew :hato-client:integrationTestSingleCarrier -Phato.interop=none
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-single-carrier
          path: |
            **/build/reports/tests/
            **/build/test-results/

  latest-jdk:
    name: Tests on the latest JDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      # The classes still target Java 25; only the tests run on the newest JDK release, which
      # Gradle provisions. Raise the release here when a new one comes out.
      - run: ./gradlew test integrationTest -Phato.testJava=27 -Phato.interop=none
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-latest-jdk
          path: |
            **/build/reports/tests/
            **/build/test-results/

  interop:
    name: Interoperability with ${{ matrix.broker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        broker: [emqx, hivemq, nanomq, rabbitmq]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - run: >-
          ./gradlew :hato-common:integrationTest :hato-client:integrationTest
          :hato-client:integrationTestSingleCarrier -Phato.interop=${{ matrix.broker }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.broker }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  native-smoke:
    name: GraalVM native-image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - run: ./gradlew :native-smoke:nativeCompile
      # The smoke reads the public test identities for its TLS and WSS round trips at run time.
      # It takes seconds; the limit stops a hang in the image long before the job's default
      # timeout.
      - timeout-minutes: 5
        run: |
          ./native-smoke/build/native/nativeCompile/hato-native-smoke \
            test-support/src/main/resources/tls

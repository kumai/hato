name: Release

on:
  # Publishing a GitHub Release publishes to Maven Central. A manual trial on a pre-release tag,
  # such as v0.3.0-rc.1, stops for review in the Portal.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reject a tag that cannot be released before the full build runs.
  version:
    name: Check the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - id: release
        run: ./gradlew :release-tools:checkReleaseTag

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  upload:
    name: Sign and upload to Maven Central
    needs: [version, checks]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # Third-party actions in this job run before the signing key reaches Gradle: pin them.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-disabled: true
      - name: Build and check the signed bundle
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          HATO_SIGNING_KEY: ${{ secrets.HATO_SIGNING_KEY }}
          HATO_SIGNING_PASSWORD: ${{ secrets.HATO_SIGNING_PASSWORD }}
        run: |
          test -n "$HATO_SIGNING_KEY" || { echo 'Missing HATO_SIGNING_KEY' >&2; exit 1; }
          ./gradlew --no-configuration-cache \
            :distribution-tests:verifyReleaseBundle :release-tools:installDist \
            -Pversion="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: hato-${{ needs.version.outputs.version }}
          path: distribution-tests/build/distributions/hato-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error
      # The installed tool runs outside Gradle, so the Portal token reaches only this step.
      - name: Upload and wait for the Portal
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          release-tools/build/install/release-tools/bin/release-tools upload \
            "distribution-tests/build/distributions/hato-${RELEASE_VERSION}.zip"

  # After a release of the version on the default branch, move the branch to the next minor
  # SNAPSHOT. Only first-party actions and the checksum-verified Gradle wrapper run here, and
  # only the last step holds the token that can push.
  next-version:
    name: Move the default branch to the next version
    needs: [version, upload]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - id: next
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew :release-tools:moveToNextVersion
      - name: Push the version
        if: steps.next.outputs.next != ''
        env:
          NEXT_VERSION: ${{ steps.next.outputs.next }}
          BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: move the version to ${NEXT_VERSION}" -- gradle.properties
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH}"
